<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Account{% endblock %} | PCCSMS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='20261028') }}">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-aside">
      <a class="brand auth-brand" href="{{ url_for('login') }}" aria-label="PCCSMS"><span class="brand-mark"><i data-lucide="message-square-text"></i></span><span class="brand-copy"><strong>PCCSMS</strong><small>Customer support</small></span></a>
      <div class="auth-aside-copy"><span class="eyebrow">CUSTOMER CARE, MADE CLEAR</span><h2>Support that keeps you in the loop.</h2><p>Submit a complaint, follow its progress, and find your updates in one place.</p></div>
      <div class="auth-preview" aria-hidden="true"><div class="preview-top"><span></span><span></span><span></span></div><div class="preview-line preview-line-wide"></div><div class="preview-line"></div><div class="preview-status"><span></span><i data-lucide="check"></i></div><div class="preview-card"><span></span><span></span><span></span></div></div>
      <p class="auth-aside-foot"><i data-lucide="lock-keyhole"></i> Your account keeps your complaints private.</p>
    </section>
    <section class="auth-content">
      <a class="mobile-auth-brand" href="{{ url_for('login') }}"><span class="brand-mark"><i data-lucide="message-square-text"></i></span><strong>PCCSMS</strong></a>
      {% block content %}{% endblock %}
      <p class="auth-legal">PCCSMS · Customer support management</p>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js" defer></script>
  <script>document.addEventListener('DOMContentLoaded',()=>window.lucide&&window.lucide.createIcons());</script>
</body>
</html>
