{% extends 'shared/base.html' %}{% block title %}Request error{% endblock %}{% block content %}<section class="error-page"><span class="error-code">!</span><h1>Could not complete the request</h1><p>{{ message or 'Please try again.' }}</p>{% if current_user.is_authenticated %}<a href="{{ url_for('dashboard') if current_user.role == 'admin' else url_for('customer_dashboard') }}" class="button button-primary">Back to dashboard</a>{% else %}<a href="{{ url_for('login') }}" class="button button-primary">Sign in</a>{% endif %}</section>{% endblock %}
